<text x="406" y="272" fill="#444d56" font-size="7" text-anchor="end">0</text>

<!-- CPU line -->
<polyline points="412,232 451,224 490,236 529,216 568,228 607,210 646,222 685,204 724,218 763,200 802,214 841,196 880,208"
  fill="none" stroke="#ff9830" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>


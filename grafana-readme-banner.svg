<!-- animated scanline -->
<rect x="412" y="186" width="2" height="84" fill="#ffffff" opacity="0.06">
  <animateTransform attributeName="transform" type="translate" from="0,0" to="468,0" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- x-axis labels -->
<text x="412" y="285" fill="#444d56" font-size="7">-5m</text>
<text x="490" y="285" fill="#444d56" font-size="7">-4m</text>
<text x="568" y="285" fill="#444d56" font-size="7">-3m</text>

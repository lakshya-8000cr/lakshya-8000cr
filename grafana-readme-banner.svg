<text x="724" y="285" fill="#444d56" font-size="7">-1m</text>
<text x="802" y="285" fill="#444d56" font-size="7">now</text>

<!-- ===== ROW 3: LOKI LOG STREAM ===== -->
<rect x="12" y="318" width="878" height="130" fill="#161b22" rx="5" stroke="#21262d" stroke-width="0.8"/>
<text x="22" y="336" fill="#444d56" font-size="9" letter-spacing="0.5">LOKI — LIVE LOG STREAM</text>
<circle cx="122" cy="330" r="4" fill="#73bf69" class="blink"/>

<!-- clipped scroll area -->
<g clip-path="url(#logClip)" transform="translate(12,340)">
  <g class="scroll-logs">
    <!-- 12 log lines × 24px = 288px, animates -144px so loops halfway -->
    <text x="10" y="14"  fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:01</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">forge-api      </tspan><tspan fill="#d1d5db">reconcile loop complete · all resources stable</tspan></text>
    <text x="10" y="38"  fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:03</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">kaniko         </tspan><tspan fill="#d1d5db">image build started · ref=sha:a1b2c3d4</tspan></text>
    <text x="10" y="62"  fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:05</tspan>  <tspan fill="#ff9830">[WARN ]</tspan>  <tspan fill="#5794f2">nginx-ingress  </tspan><tspan fill="#d1d5db">upstream latency spike · 420ms p99</tspan></text>
    <text x="10" y="86"  fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:08</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">kube-api       </tspan><tspan fill="#d1d5db">pod lakshya-worker-7d9f scaled up · node=worker-2</tspan></text>
    <text x="10" y="110" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:11</tspan>  <tspan fill="#b877d9">[DEBUG]</tspan>  <tspan fill="#5794f2">promtail       </tspan><tspan fill="#d1d5db">scraping /metrics · 47 series collected</tspan></text>
    <text x="10" y="134" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:13</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">forge-api      </tspan><tspan fill="#d1d5db">deploy accepted · namespace=production env=prod</tspan></text>
    <text x="10" y="158" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:15</tspan>  <tspan fill="#f2495c">[ERROR]</tspan>  <tspan fill="#5794f2">postgres       </tspan><tspan fill="#d1d5db">slow query &gt;1s detected · table=deployments</tspan></text>
    <text x="10" y="182" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:17</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">kaniko         </tspan><tspan fill="#d1d5db">pushed to ghcr.io/lakshya/forge:latest ✓</tspan></text>
    <text x="10" y="206" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:19</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">cert-manager   </tspan><tspan fill="#d1d5db">TLS cert renewed · valid for 90d</tspan></text>
    <text x="10" y="230" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:21</tspan>  <tspan fill="#ff9830">[WARN ]</tspan>  <tspan fill="#5794f2">forge-api      </tspan><tspan fill="#d1d5db">memory pressure · GC triggered · heap freed 64MB</tspan></text>
    <text x="10" y="254" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:24</tspan>  <tspan fill="#b877d9">[DEBUG]</tspan>  <tspan fill="#5794f2">kube-api       </tspan><tspan fill="#d1d5db">watch event NODE_READY · node=worker-3</tspan></text>
    <text x="10" y="278" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:26</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">loki           </tspan><tspan fill="#d1d5db">chunk flushed · 2.3MB compressed · ingester=0</tspan></text>
    <!-- repeat first 6 for seamless loop -->
    <text x="10" y="302" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:01</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">forge-api      </tspan><tspan fill="#d1d5db">reconcile loop complete · all resources stable</tspan></text>
    <text x="10" y="326" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:03</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">kaniko         </tspan><tspan fill="#d1d5db">image build started · ref=sha:a1b2c3d4</tspan></text>
    <text x="10" y="350" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:05</tspan>  <tspan fill="#ff9830">[WARN ]</tspan>  <tspan fill="#5794f2">nginx-ingress  </tspan><tspan fill="#d1d5db">upstream latency spike · 420ms p99</tspan></text>
    <text x="10" y="374" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:08</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">kube-api       </tspan><tspan fill="#d1d5db">pod lakshya-worker-7d9f scaled up · node=worker-2</tspan></text>
    <text x="10" y="398" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:11</tspan>  <tspan fill="#b877d9">[DEBUG]</tspan>  <tspan fill="#5794f2">promtail       </tspan><tspan fill="#d1d5db">scraping /metrics · 47 series collected</tspan></text>
    <text x="10" y="422" fill="#444d56" font-size="10"><tspan fill="#444d56">10:24:13</tspan>  <tspan fill="#5794f2">[INFO ]</tspan>  <tspan fill="#5794f2">forge-api      </tspan><tspan fill="#d1d5db">deploy accepted · namespace=production env=prod</tspan></text>
  </g>
</g>

<!-- footer bar -->
<rect x="0" y="458" width="900" height="22" fill="#1c2333" rx="0"/>
<rect x="0" y="458" width="900" height="5" fill="#1c2333"/>
<rect x="0" y="458" width="900" height="1" fill="#21262d"/>

<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
*{font-family:'JetBrains Mono','Courier New',monospace}
.blink{animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.scroll-logs{animation:scrollLogs 14s linear infinite}
@keyframes scrollLogs{0%{transform:translateY(0)}100%{transform:translateY(-168px)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.scanline{animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(468px)}}
</style>
<clipPath id="logClip"><rect x="0" y="0" width="876" height="104"/></clipPath>
</defs>

